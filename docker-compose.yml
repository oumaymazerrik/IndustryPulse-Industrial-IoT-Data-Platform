
name: industrypulse

# ============================================================
# AIRFLOW - CONFIGURATION COMMUNE
# ============================================================

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.0

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-db:5432/airflow

    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}

    AIRFLOW__API__BASE_URL: http://localhost:8080

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    SPARK_RUNNER_TOKEN: ${SPARK_RUNNER_TOKEN:?Set SPARK_RUNNER_TOKEN in .env}

    IOT_DB_NAME: industrypulse
    IOT_DB_USER: industrypulse
    IOT_DB_PASSWORD: ${IOT_DB_PASSWORD:?Set IOT_DB_PASSWORD in .env}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins


# ============================================================
# SERVICES
# ============================================================

services:

  # ==========================================================
  # MQTT - MOSQUITTO
  # ==========================================================

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: industrypulse-mqtt

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

    restart: unless-stopped


  # ==========================================================
  # APACHE KAFKA
  # ==========================================================

  kafka:
    image: apache/kafka:3.9.1
    container_name: industrypulse-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://:29092,
        CONTROLLER://:29093,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped


  # ==========================================================
  # MINIO - DATA LAKE ICEBERG
  # ==========================================================

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: industrypulse-minio

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

    volumes:
      - minio_data:/data

    restart: unless-stopped


  # ==========================================================
  # TIMESCALEDB - POSTGRESQL
  # ==========================================================

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: industrypulse-timescaledb

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: industrypulse

      POSTGRES_USER: industrypulse

      POSTGRES_PASSWORD: ${IOT_DB_PASSWORD:?Set IOT_DB_PASSWORD in .env}

    volumes:
      - timescaledb_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U industrypulse -d industrypulse

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================================
  # APACHE SPARK - CUSTOM IMAGE
  # ==========================================================

  spark:
    build:
      context: .
      dockerfile: spark-runner/Dockerfile

    image: industrypulse-spark:local

    container_name: industrypulse-spark

    depends_on:
      - kafka
      - minio
      - timescaledb

    environment:
      SPARK_RUNNER_TOKEN: ${SPARK_RUNNER_TOKEN:?Set SPARK_RUNNER_TOKEN in .env}

      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

      MINIO_ENDPOINT: http://minio:9000

      IOT_DB_HOST: timescaledb
      IOT_DB_PORT: "5432"
      IOT_DB_NAME: industrypulse
      IOT_DB_USER: industrypulse

      IOT_DB_PASSWORD: ${IOT_DB_PASSWORD:?Set IOT_DB_PASSWORD in .env}

    volumes:
      - ./src:/app/src
      - ./spark:/app/spark
      - ./data:/app/data
      - ./spark-runner:/app/runner

    working_dir: /app

    command:
      - python
      - -u
      - /app/runner/server.py

    ports:
      - "4040:4040"

    expose:
      - "8090"

    restart: unless-stopped


  # ==========================================================
  # GRAFANA
  # ==========================================================

  grafana:
    image: grafana/grafana:latest
    container_name: industrypulse-grafana

    depends_on:
      timescaledb:
        condition: service_healthy

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin

      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped


  # ==========================================================
  # AIRFLOW - POSTGRESQL METADATA DATABASE
  # ==========================================================

  airflow-db:
    image: postgres:16
    container_name: industrypulse-airflow-db

    environment:
      POSTGRES_USER: airflow

      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}

      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U airflow -d airflow

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================================
  # AIRFLOW - INITIALISATION
  # ==========================================================

  airflow-init:
    <<: *airflow-common

    container_name: industrypulse-airflow-init

    depends_on:
      airflow-db:
        condition: service_healthy

    command:
      - bash
      - -c
      - airflow db migrate

    restart: "no"


  # ==========================================================
  # AIRFLOW - API SERVER
  # ==========================================================

  airflow-apiserver:
    <<: *airflow-common

    container_name: industrypulse-airflow-apiserver

    depends_on:
      airflow-db:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    command: api-server

    ports:
      - "8080:8080"

    restart: unless-stopped


  # ==========================================================
  # AIRFLOW - SCHEDULER
  # ==========================================================

  airflow-scheduler:
    <<: *airflow-common

    container_name: industrypulse-airflow-scheduler

    depends_on:
      airflow-db:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

      airflow-apiserver:
        condition: service_started

      spark:
        condition: service_started

    command: scheduler

    restart: unless-stopped


  # ==========================================================
  # AIRFLOW - DAG PROCESSOR
  # ==========================================================

  airflow-dag-processor:
    <<: *airflow-common

    container_name: industrypulse-airflow-dag-processor

    depends_on:
      airflow-db:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    command: dag-processor

    restart: unless-stopped


# ============================================================
# VOLUMES PERSISTANTS
# ============================================================

volumes:
  kafka_data:
  minio_data:
  timescaledb_data:
  grafana_data:
  airflow_postgres_data:
