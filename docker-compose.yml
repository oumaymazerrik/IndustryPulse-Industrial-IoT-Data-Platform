services:

  # ==========================================================
  # MQTT - Eclipse Mosquitto
  # ==========================================================
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: industrypulse-mqtt

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

    restart: unless-stopped


  # ==========================================================
  # Apache Kafka - KRaft
  # ==========================================================
  kafka:
    image: apache/kafka:3.9.1
    container_name: industrypulse-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        PLAINTEXT://:29092,
        CONTROLLER://:29093,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped


  # ==========================================================
  # MinIO
  # ==========================================================
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: industrypulse-minio

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: industrypulse123

    volumes:
      - minio_data:/data

    restart: unless-stopped


  # ==========================================================
  # PostgreSQL + TimescaleDB
  # ==========================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: industrypulse-timescaledb

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: industrypulse
      POSTGRES_USER: industrypulse
      POSTGRES_PASSWORD: industrypulse123

    volumes:
      - timescaledb_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrypulse -d industrypulse"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================================
  # Apache Spark
  # ==========================================================
  spark:
    image: spark-python:latest
    container_name: industrypulse-spark

    depends_on:
      - kafka
      - minio
      - timescaledb

    volumes:
      - ./src:/app/src
      - ./spark:/app/spark
      - ./data:/app/data

    working_dir: /app

    command: ["tail", "-f", "/dev/null"]

    ports:
      - "4040:4040"

    restart: unless-stopped


  # ==========================================================
  # Grafana
  # ==========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: industrypulse-grafana

    depends_on:
      timescaledb:
        condition: service_healthy

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: industrypulse123

    volumes:
      - grafana_data:/var/lib/grafana

    restart: unless-stopped


# ============================================================
# VOLUMES
# ============================================================
volumes:
  kafka_data:
  minio_data:
  timescaledb_data:
  grafana_data: